<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chimneyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#c53030"/>
      <stop offset="50%" style="stop-color:#ed8936"/>
      <stop offset="100%" style="stop-color:#ecc94b"/>
    </linearGradient>
  </defs>
  
  <!-- Chimney Base -->
  <rect x="16" y="20" width="32" height="40" rx="2" fill="url(#chimneyGrad)"/>
  
  <!-- Chimney Crown -->
  <rect x="12" y="16" width="40" height="6" rx="1" fill="url(#chimneyGrad)"/>
  
  <!-- Chimney Cap -->
  <rect x="14" y="12" width="36" height="5" rx="1" fill="#1a365d"/>
  <rect x="20" y="8" width="24" height="5" rx="1" fill="#0d1f3c"/>
  
  <!-- Chimney Flue Lines -->
  <line x1="22" y1="22" x2="22" y2="58" stroke="#4a5568" stroke-width="1"/>
  <line x1="42" y1="22" x2="42" y2="58" stroke="#4a5568" stroke-width="1"/>
  
  <!-- Brick Pattern -->
  <line x1="16" y1="30" x2="48" y2="30" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="16" y1="40" x2="48" y2="40" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="16" y1="50" x2="48" y2="50" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="32" y1="20" x2="32" y2="30" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="24" y1="30" x2="24" y2="40" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="40" y1="30" x2="40" y2="40" stroke="#4a5568" stroke-width="0.5"/>
  <line x1="32" y1="40" x2="32" y2="50" stroke="#4a5568" stroke-width="0.5"/>
  
  <!-- Flame -->
  <path d="M32 10 Q28 6 30 2 Q32 0 34 2 Q36 6 32 10" fill="url(#flameGrad)"/>
  
  <!-- NFPA 211 Text Badge -->
  <circle cx="52" cy="52" r="10" fill="#c53030"/>
  <text x="52" y="55" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">211</text>
</svg>
