<!-- Photo Section Partial -->
<section class="report-section">
    <h2>Photo Documentation</h2>
    <div class="photo-grid">
        <figure class="photo-item">
            <img src="[photo-path-1]" alt="[Photo description]" loading="lazy">
            <figcaption>Photo 1: [Component] - [Condition/Finding]</figcaption>
        </figure>
        <figure class="photo-item">
            <img src="[photo-path-2]" alt="[Photo description]" loading="lazy">
            <figcaption>Photo 2: [Component] - [Condition/Finding]</figcaption>
        </figure>
        <figure class="photo-item">
            <img src="[photo-path-3]" alt="[Photo description]" loading="lazy">
            <figcaption>Photo 3: [Component] - [Condition/Finding]</figcaption>
        </figure>
    </div>
</section>

<!-- Usage Notes:
     - Replace [photo-path-X] with actual image paths
     - Update alt text with descriptive text for accessibility
     - Number photos sequentially and reference in findings notes
     - Add or remove photo items as needed
-->
