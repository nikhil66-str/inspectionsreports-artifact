<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7fafc"/>
      <stop offset="100%" style="stop-color:#edf2f7"/>
    </linearGradient>
    <linearGradient id="flueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="50%" style="stop-color:#718096"/>
      <stop offset="100%" style="stop-color:#4a5568"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad3)"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a365d" text-anchor="middle">Flue Video Scan Zones</text>
  
  <!-- Chimney Outline -->
  <rect x="100" y="50" width="200" height="480" fill="none" stroke="#2d3748" stroke-width="3" rx="5"/>
  
  <!-- Crown Area - Zone 5 -->
  <rect x="102" y="52" width="196" height="80" fill="#c6f6d5" stroke="#276749" stroke-width="1"/>
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#276749" text-anchor="middle">ZONE 5</text>
  <text x="200" y="95" font-family="Arial, sans-serif" font-size="11" fill="#276749" text-anchor="middle">Crown Area</text>
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle">Cap, Crown, Termination</text>
  
  <!-- Upper Flue - Zone 4 -->
  <rect x="102" y="132" width="196" height="90" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1"/>
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0" text-anchor="middle">ZONE 4</text>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="11" fill="#2b6cb0" text-anchor="middle">Upper Flue</text>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle">Liner condition, joints</text>
  
  <!-- Middle Flue - Zone 3 -->
  <rect x="102" y="222" width="196" height="90" fill="#feebc8" stroke="#c05621" stroke-width="1"/>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c05621" text-anchor="middle">ZONE 3</text>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="11" fill="#c05621" text-anchor="middle">Middle Flue</text>
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle">Creosote, cracks, damage</text>
  
  <!-- Lower Flue - Zone 2 -->
  <rect x="102" y="312" width="196" height="90" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1"/>
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b46c1" text-anchor="middle">ZONE 2</text>
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle">Lower Flue</text>
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle">Smoke shelf transition</text>
  
  <!-- Smoke Chamber - Zone 1 -->
  <rect x="102" y="402" width="196" height="126" fill="#fed7d7" stroke="#c53030" stroke-width="1"/>
  <text x="200" y="440" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c53030" text-anchor="middle">ZONE 1</text>
  <text x="200" y="460" font-family="Arial, sans-serif" font-size="11" fill="#c53030" text-anchor="middle">Smoke Chamber</text>
  <text x="200" y="480" font-family="Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle">Pargeting, damper area</text>
  
  <!-- Flue Interior Line -->
  <line x1="140" y1="50" x2="140" y2="530" stroke="#2d3748" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="50" x2="260" y2="530" stroke="#2d3748" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Video Camera Icon -->
  <circle cx="200" cy="560" r="15" fill="#1a365d"/>
  <rect x="188" y="552" width="24" height="16" rx="2" fill="#2c5282"/>
  <circle cx="200" cy="560" r="5" fill="#63b3ed"/>
  <text x="200" y="585" font-family="Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle">Video Camera</text>
  
  <!-- Arrow showing direction -->
  <path d="M200 540 L200 520 L195 525 M200 520 L205 525" stroke="#1a365d" stroke-width="2" fill="none"/>
  
  <!-- Legend Labels on Right -->
  <g transform="translate(320, 90)">
    <rect x="0" y="-10" width="15" height="15" fill="#c6f6d5" stroke="#276749"/>
    <text x="20" y="2" font-family="Arial, sans-serif" font-size="9" fill="#2d3748">Top</text>
  </g>
  <g transform="translate(320, 170)">
    <rect x="0" y="-10" width="15" height="15" fill="#bee3f8" stroke="#2b6cb0"/>
    <text x="20" y="2" font-family="Arial, sans-serif" font-size="9" fill="#2d3748">Upper</text>
  </g>
  <g transform="translate(320, 260)">
    <rect x="0" y="-10" width="15" height="15" fill="#feebc8" stroke="#c05621"/>
    <text x="20" y="2" font-family="Arial, sans-serif" font-size="9" fill="#2d3748">Middle</text>
  </g>
  <g transform="translate(320, 350)">
    <rect x="0" y="-10" width="15" height="15" fill="#e9d8fd" stroke="#6b46c1"/>
    <text x="20" y="2" font-family="Arial, sans-serif" font-size="9" fill="#2d3748">Lower</text>
  </g>
  <g transform="translate(320, 460)">
    <rect x="0" y="-10" width="15" height="15" fill="#fed7d7" stroke="#c53030"/>
    <text x="20" y="2" font-family="Arial, sans-serif" font-size="9" fill="#2d3748">Chamber</text>
  </g>
</svg>
