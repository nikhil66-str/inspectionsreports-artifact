<!-- Summary Partial -->
<section class="report-section">
    <h2>Summary of Findings</h2>
    <div class="findings-summary">
        <div class="finding-category satisfactory">
            <h3>✓ Satisfactory Items</h3>
            <ul>
                <li>[List items in good condition]</li>
                <li>[List items in good condition]</li>
            </ul>
        </div>
        <div class="finding-category attention">
            <h3>⚠ Requires Attention</h3>
            <ul>
                <li>[List items needing attention]</li>
            </ul>
        </div>
        <div class="finding-category deficient">
            <h3>✗ Deficient Items</h3>
            <ul>
                <li>[List deficient items, or "None identified"]</li>
            </ul>
        </div>
    </div>
</section>

<!-- Usage Notes:
     - Group findings by severity category
     - Keep descriptions brief - details are in the findings table
     - Use "None identified" when a category has no items
-->
