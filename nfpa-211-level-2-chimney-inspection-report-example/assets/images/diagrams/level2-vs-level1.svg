<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7fafc"/>
      <stop offset="100%" style="stop-color:#edf2f7"/>
    </linearGradient>
    <linearGradient id="level1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1"/>
      <stop offset="100%" style="stop-color:#2b6cb0"/>
    </linearGradient>
    <linearGradient id="level2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78"/>
      <stop offset="100%" style="stop-color:#276749"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a365d" text-anchor="middle">Level 1 vs Level 2 Inspection Comparison</text>
  
  <!-- Level 1 Column -->
  <rect x="50" y="60" width="320" height="320" rx="10" fill="white" stroke="#4299e1" stroke-width="3"/>
  <rect x="50" y="60" width="320" height="50" rx="10" fill="url(#level1Grad)"/>
  <text x="210" y="93" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">LEVEL 1 INSPECTION</text>
  
  <!-- Level 1 Items -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#2d3748">
    <text x="70" y="140">✓ Readily accessible areas</text>
    <text x="70" y="170">✓ Visual inspection only</text>
    <text x="70" y="200">✓ Basic safety check</text>
    <text x="70" y="230">✓ Annual maintenance</text>
    <text x="70" y="260">✗ No video scan</text>
    <text x="70" y="290">✗ No attic/crawl space</text>
    <text x="70" y="320">✗ Limited clearance check</text>
    <text x="70" y="350">✗ Basic documentation</text>
  </g>
  
  <!-- Level 2 Column -->
  <rect x="430" y="60" width="320" height="320" rx="10" fill="white" stroke="#48bb78" stroke-width="3"/>
  <rect x="430" y="60" width="320" height="50" rx="10" fill="url(#level2Grad)"/>
  <text x="590" y="93" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">LEVEL 2 INSPECTION</text>
  
  <!-- Level 2 Items -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#2d3748">
    <text x="450" y="140">✓ All Level 1 components</text>
    <text x="450" y="170">✓ Video scan of flue interior</text>
    <text x="450" y="200">✓ Attic inspection</text>
    <text x="450" y="230">✓ Crawl space inspection</text>
    <text x="450" y="260">✓ Clearance verification</text>
    <text x="450" y="290">✓ Detailed documentation</text>
    <text x="450" y="320">✓ Photo evidence</text>
    <text x="450" y="350">✓ Professional report</text>
  </g>
  
  <!-- Arrow -->
  <path d="M385 200 L405 190 L405 195 L420 195 L420 205 L405 205 L405 210 Z" fill="#718096"/>
</svg>
