<!-- Summary Partial -->
<section id="summary" class="report-section">
    <h2>Summary of Findings</h2>

    <div class="findings-summary">
        <!-- Satisfactory Items -->
        <div class="finding-category satisfactory">
            <h3>✓ Satisfactory Items</h3>
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>
        </div>

        <!-- Items Requiring Attention -->
        <div class="finding-category attention">
            <h3>⚠ Requires Attention</h3>
            <ul>
                <li>Item 1</li>
            </ul>
        </div>

        <!-- Deficient Items -->
        <div class="finding-category deficient">
            <h3>✗ Deficient Items</h3>
            <ul>
                <li>None identified</li>
            </ul>
        </div>
    </div>

    <h3>Recommendations</h3>
    <ol class="recommendations-list">
        <li>Recommendation 1</li>
        <li>Recommendation 2</li>
        <li>Recommendation 3</li>
    </ol>

    <h3>Overall Assessment</h3>
    <div class="overall-assessment">
        <div class="assessment-status">
            <label><input type="radio" name="assessment" value="satisfactory"> System is in satisfactory condition for
                continued use</label>
            <label><input type="radio" name="assessment" value="attention"> System requires attention before continued
                use</label>
            <label><input type="radio" name="assessment" value="unsafe"> System is unsafe - do not use until repairs
                completed</label>
        </div>
    </div>
</section>
