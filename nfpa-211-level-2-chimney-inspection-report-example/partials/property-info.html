<!-- Property Information Partial -->
<section id="property-info" class="report-section">
    <h2>Property Information</h2>
    <div class="info-grid">
        <div class="info-item">
            <label>Property Address:</label>
            <span class="value" data-field="address"></span>
        </div>
        <div class="info-item">
            <label>City, State, ZIP:</label>
            <span class="value" data-field="city-state-zip"></span>
        </div>
        <div class="info-item">
            <label>Inspection Date:</label>
            <span class="value" data-field="inspection-date"></span>
        </div>
        <div class="info-item">
            <label>Report Number:</label>
            <span class="value" data-field="report-number"></span>
        </div>
        <div class="info-item">
            <label>Client Name:</label>
            <span class="value" data-field="client-name"></span>
        </div>
        <div class="info-item">
            <label>Client Contact:</label>
            <span class="value" data-field="client-contact"></span>
        </div>
        <div class="info-item">
            <label>Property Type:</label>
            <span class="value" data-field="property-type"></span>
        </div>
        <div class="info-item">
            <label>Appliance Type:</label>
            <span class="value" data-field="appliance-type"></span>
        </div>
    </div>
</section>
