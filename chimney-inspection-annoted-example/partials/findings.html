<!-- Findings Partial -->
<section class="report-section">
    <h2>Inspection Findings</h2>

    <table class="findings-table">
        <thead>
            <tr>
                <th>Component</th>
                <th>Condition</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td data-label="Component">[Component Name]</td>
                <td data-label="Condition" class="status-good">Satisfactory</td>
                <td data-label="Notes">[Observations]</td>
            </tr>
            <tr>
                <td data-label="Component">[Component Name]</td>
                <td data-label="Condition" class="status-warning">Needs Attention</td>
                <td data-label="Notes">[Observations - See Photo X]</td>
            </tr>
            <tr>
                <td data-label="Component">[Component Name]</td>
                <td data-label="Condition" class="status-danger">Deficient</td>
                <td data-label="Notes">[Observations - See Photos X-Y]</td>
            </tr>
        </tbody>
    </table>
</section>

<!-- Usage Notes:
     - Replace [Component Name] with actual component being evaluated
     - Use appropriate status class: status-good, status-warning, or status-danger
     - Reference photo numbers in notes for visual evidence
     - Add or remove rows as needed for your inspection
-->
