<!-- Photo Section Example -->
<div class="photo-grid">
    <figure class="photo-item">
        <div
            style="width: 100%; height: 200px; background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e0 100%); display: flex; align-items: center; justify-content: center; color: #4a5568; font-size: 14px;">
            [Example Photo Reference]
        </div>
        <figcaption><strong>Good Caption:</strong> "Attic clearance measured at 2.5 inches - compliant with NFPA 211
            requirements"</figcaption>
    </figure>
    <figure class="photo-item">
        <div
            style="width: 100%; height: 200px; background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e0 100%); display: flex; align-items: center; justify-content: center; color: #4a5568; font-size: 14px;">
            [Example Photo Reference]
        </div>
        <figcaption><strong>Avoid:</strong> "Everything looks good here" (too vague)</figcaption>
    </figure>
</div>

<div class="context-box">
    <p class="context-title">Photo Caption Best Practices</p>
    <ul>
        <li>Include specific measurements when relevant</li>
        <li>Reference the location clearly</li>
        <li>State what the photo demonstrates</li>
        <li>Avoid subjective judgments</li>
    </ul>
</div>
